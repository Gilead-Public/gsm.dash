name: Publish a release to GitHub Pages

# Publishes one release: the reports that a qualifying validation run built and tested, copied byte for byte, never
# rebuilt. The data is the SYNTHETIC example portfolio (scripts/generate-example-data.mjs); nothing sensitive is
# deployed.
#
# Run it from main with the release's tag. The tag must be on a commit whose validation run came from a push to main,
# and the GitHub release on that tag must carry the reviewers' acceptance.json (validation/accept.js).
# validation/release.js refuses anything else, and then nothing is deployed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, on the commit whose validation run is published
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# One deployment at a time; a release that has started finishes rather than being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Find the tag's commit and its validation run
        id: find
        run: |
          git fetch --depth=1 --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validation.yml/runs?head_sha=$commit&event=push&branch=main&status=success" \
            --jq '.workflow_runs | sort_by(.run_number) | last | select(. != null) | "\(.id) \(.run_attempt)"')
          if [ -z "$run" ]; then echo "::error::no successful validation run from a push to main on $commit"; exit 1; fi
          read -r id attempt <<< "$run"
          { echo "commit=$commit"; echo "id=$id"; echo "attempt=$attempt"; } >> "$GITHUB_OUTPUT"
      - name: Download that run's record and the release's acceptance
        env:
          ID: ${{ steps.find.outputs.id }}
          ATTEMPT: ${{ steps.find.outputs.attempt }}
        run: |
          gh run download "$ID" -R "$GITHUB_REPOSITORY" -n "validation-run-$ID-$ATTEMPT" -D run
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p acceptance.json -D acceptance
      - name: Check the run and stage its reports
        env:
          RUN: run/gh-${{ steps.find.outputs.id }}-${{ steps.find.outputs.attempt }}
          COMMIT: ${{ steps.find.outputs.commit }}
        run: node validation/release.js "$RUN" --tag-commit "$COMMIT" --acceptance acceptance/acceptance.json --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
